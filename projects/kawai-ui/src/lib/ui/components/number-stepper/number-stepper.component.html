<label
  class="label"
  [for]="inputId"
  [class.truncate]="labelOptions().truncate"
  [style.text-align]="labelOptions().align"
  [kawaiTooltip]="labelTooltip()"
  >{{ labelOptions().text }}</label
>
<div class="stepper">
  <button
    type="button"
    [attr.aria-label]="'Decrease ' + labelOptions().text"
    [attr.aria-controls]="inputId"
    [attr.aria-disabled]="value() <= min()"
    (click)="step(-1)"
  >
    −
  </button>
  <input
    #field
    type="number"
    inputmode="numeric"
    step="1"
    [id]="inputId"
    [min]="min()"
    [max]="max()"
    [value]="value()"
    (input)="typed(field)"
    (blur)="restore(field)"
  />
  <button
    type="button"
    [attr.aria-label]="'Increase ' + labelOptions().text"
    [attr.aria-controls]="inputId"
    [attr.aria-disabled]="value() >= max()"
    (click)="step(1)"
  >
    +
  </button>
</div>
