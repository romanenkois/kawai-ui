<h2 [id]="headingId">
  <button
    type="button"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId"
    (click)="toggled.emit()"
  >
    <span class="chevron" aria-hidden="true">{{ expanded() ? '▾' : '▸' }}</span>
    <span class="label" [appTooltip]="heading()" tooltipOnlyWhenTruncated>{{ heading() }}</span>
  </button>
</h2>
<div class="body" [class.scroll]="overflow() === 'scroll'" [id]="bodyId" [hidden]="!expanded()">
  @if (expanded()) {
    <ng-container [ngTemplateOutlet]="body()" />
  }
</div>
