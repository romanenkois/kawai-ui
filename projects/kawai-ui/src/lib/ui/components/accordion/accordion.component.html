<!-- The heading element can't be bound, so each level wraps the same header button. -->
@switch (headingLevelValue()) {
  @case (1) {
    <h1 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h1>
  }
  @case (2) {
    <h2 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h2>
  }
  @case (3) {
    <h3 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h3>
  }
  @case (4) {
    <h4 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h4>
  }
  @case (5) {
    <h5 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h5>
  }
  @case (6) {
    <h6 class="heading" [id]="headingId"><ng-container [ngTemplateOutlet]="header" /></h6>
  }
}
<ng-template #header>
  <button
    type="button"
    [class.indicator-start]="indicatorOptions()?.position === 'start'"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId"
    [attr.aria-label]="buttonLabel()"
    (click)="toggled.emit()"
  >
    @if (headingTemplate(); as customHeading) {
      <span #label class="label" [style.text-align]="headingOptions().align">
        <ng-container
          [ngTemplateOutlet]="customHeading.template"
          [ngTemplateOutletContext]="context()"
        />
      </span>
    } @else {
      <span
        #label
        class="label"
        [class.truncate]="headingOptions().truncate"
        [style.text-align]="headingOptions().align"
        [kawaiTooltip]="labelTooltip()"
        >{{ headingOptions().text }}</span
      >
    }
    @if (indicatorOptions(); as resolvedIndicator) {
      <span
        class="indicator"
        aria-hidden="true"
        [class.rotate]="resolvedIndicator.rotate"
        [class.expanded]="expanded()"
      >
        @if (indicatorTemplate(); as customIndicator) {
          <ng-container
            [ngTemplateOutlet]="customIndicator.template"
            [ngTemplateOutletContext]="context()"
          />
        } @else {
          <svg viewBox="0 0 16 16" focusable="false">
            <path d="M4 6l4 4 4-4" />
          </svg>
        }
      </span>
    }
  </button>
</ng-template>
<div class="panel" [class.expanded]="expanded()">
  <div class="clip">
    <!-- A scrolling body is a named tab stop, so the keyboard can scroll it. -->
    <div
      class="body"
      [class.scroll]="bodyScrolls()"
      [id]="bodyId"
      [attr.tabindex]="bodyScrolls() ? 0 : null"
      [attr.role]="bodyScrolls() ? 'group' : null"
      [attr.aria-labelledby]="bodyScrolls() ? headingId : null"
    >
      @if (bodyRendered()) {
        <ng-container
          [ngTemplateOutlet]="bodyTemplate().template"
          [ngTemplateOutletContext]="context()"
        />
      }
    </div>
  </div>
</div>
