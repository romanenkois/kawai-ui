<span
  class="label"
  [id]="labelId"
  [class.truncate]="labelOptions().truncate"
  [style.text-align]="labelOptions().align"
  [kawaiTooltip]="labelTooltip()"
  >{{ labelOptions().text }}</span
>
<div class="options" role="radiogroup" [attr.aria-labelledby]="labelId">
  @for (option of options(); track option.value) {
    <label>
      <input
        type="radio"
        [name]="name"
        [value]="option.value"
        [checked]="option.value === value()"
        (change)="valueChange.emit(option.value)"
      />
      <span [kawaiTooltip]="{ text: option.label, onlyWhenTruncated: true }">{{
        option.label
      }}</span>
    </label>
  }
</div>
