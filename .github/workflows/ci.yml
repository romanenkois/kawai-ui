# Runs every check on each push to master and each pull request. On master, once they pass, it
# deploys Storybook to GitHub Pages: https://romanenkois.github.io/kawai-ui/ (the npm README and
# the package `homepage` link there). Needs Settings → Pages → Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run check:theme
      - run: npm run build
      - run: npm run build:playground
      - run: npx playwright install --with-deps chromium-headless-shell
      # Builds Storybook into dist/storybook/kawai-ui, then runs axe on every story.
      - run: npm run test:a11y
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/storybook/kawai-ui

  deploy-storybook:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
